</head><body class="article-page">

<main class="article-shell"><a class="article-back" href="../">← トップへ戻る</a><div class="section-heading"><p class="section-label">HABIKINO LOCAL</p><h1 style="font-size:clamp(34px,5vw,54px);line-height:1.3">羽曳野のこと</h1><p>地元の暮らしに役立つ情報を、出典を確認しながら分かりやすくまとめます。</p></div><div class="articles-page-grid" id="articles-list"></div></main>

<script>
fetch('../data/articles.json',{cache:'no-store'}).then(r=>r.json()).then(articles=>{document.getElementById('articles-list').innerHTML=articles.map(a=>`<article class="local-news-card"><div class="local-news-thumb">${a.card_label||'羽曳野のこと'}</div><div class="local-news-body"><div class="local-news-meta"><span class="local-news-category">${a.category}</span><time>${a.date.replaceAll('-','.')}</time></div><h3>${a.title}</h3><p>${a.description}</p><a href="${a.url.split('/').pop()}">続きを読む →</a></div></article>`).join('')}).catch(()=>{document.getElementById('articles-list').innerHTML='<p>記事を読み込めませんでした。</p>'});
document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;const href=a.getAttribute('href')||'';if(a.closest('.local-news-card'))gtag('event','article_click',{link_url:a.href,link_text:(a.textContent||'').trim(),page_path:location.pathname,page_title:document.title});if(href.includes('lin.ee/'))gtag('event','line_click',{link_url:a.href,page_path:location.pathname,page_title:document.title});});
</script></body></html>
