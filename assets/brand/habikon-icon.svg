<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="はびきのコンシェルジュ">
  <title>はびきのコンシェルジュ</title>
  <rect width="1024" height="1024" rx="224" fill="#F5F1E6"/>
  <svg x="172" y="200" width="680" height="583" viewBox="40 0 840 720">
  
  <defs>
    <clipPath id="sunClip"><polygon points="416,0 718,246 900,246 900,0"/></clipPath>
  </defs>
  <!-- 太陽（ゴールド）：屋根との間にすき間を空ける -->
  <circle cx="636" cy="134" r="92" fill="#D4A95C" clip-path="url(#sunClip)"/>
  <!-- 屋根 -->
  <polygon points="52,272 400,18 700,262 662,262 400,80 130,272" fill="#1F5A42"/>
  <!-- 窓 -->
  <g fill="#1F5A42">
    <rect x="348" y="218" width="50" height="50" rx="3"/>
    <rect x="411" y="218" width="50" height="50" rx="3"/>
    <rect x="348" y="283" width="50" height="50" rx="3"/>
    <rect x="411" y="283" width="50" height="50" rx="3"/>
  </g>
  <!-- 緑の帯 -->
  <path d="M62,320 C200,302 330,328 420,420 C462,465 500,505 548,526 L482,532 C438,515 405,488 366,452 C300,408 200,416 62,426 Z" fill="#5E8F62"/>
  <!-- 深緑の大地 -->
  <path d="M66,458 C190,436 300,452 372,500 C420,532 480,596 566,640 C470,702 300,712 196,652 C118,606 74,532 66,458 Z" fill="#1F5A42"/>
  <!-- 青緑の流れ -->
  <path d="M418,512 C505,546 610,552 708,534 C770,518 820,496 860,470 C804,540 704,600 604,606 C532,604 474,562 418,512 Z" fill="#5B9893"/>
  <!-- 葉（小） -->
  <path d="M620,516 C560,474 518,404 530,322 C604,350 646,424 620,516 Z" fill="#3D7A57"/>
  <path d="M607,494 C596,450 584,420 568,392" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- 葉（大） -->
  <path d="M656,472 C636,360 716,250 836,206 C842,330 764,432 656,472 Z" fill="#2F6D4F"/>
  <path d="M668,456 C690,390 724,340 760,300" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <!-- 葉（下・細） -->
  <path d="M690,520 C748,480 806,462 860,452 C806,488 748,514 690,520 Z" fill="#5E8F62"/>
</svg>
</svg>
